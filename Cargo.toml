[package]
name = "slimfit"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-help = { git = "https://github.com/sunfmin/agent-cli", rev = "f506df826a97b2fd834e1d65b9057001a6a6e796" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
globset = "0.4.21"
libc = "0.2.191"
quick-xml = "0.42.0"
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"

# A measurement, not part of slimfit: does a test's instruction count over its
# process tree hold under load where CPU time does not (examples/treecount).
[[example]]
name = "treecount"
path = "examples/treecount/main.rs"
