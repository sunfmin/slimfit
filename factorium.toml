# How factorium gates slimfit.

# No `slow`: a promotion of a tip a green landing pushed runs only the slow
# steps (factorium#379), and slimfit has none the fast gate lacks. Every
# preset runs end to end in the fast gate against stand-ins for its tools
# (tests/standins.rs); mutants are never in a gate (`slimfit --help`). The
# real toolchains (`./e2e.sh`) run only when asked for (slimfit#136).
[gate]
fast = "./gate.sh"
fast_limit = 600
regenerated = [".docfit/baseline.json"]

[cut]
steps = ["packaging/release.sh cut $FACTORIUM_VERSION"]
formula = "sunfmin/tap/slimfit"
# The host's build, then the tap's run (release.sh waits at most 2400s).
limit = 2700

# slimfit's and docfit's own tasks and an unbiased sample of landed changes' mutants
# (`slimfit help sample`), filed as issues while the host is idle. No steps:
# no check of slimfit's is too slow for its gates. Measured cold, at load
# 18-25: `next --all` 113s, `next --all --sample 5` 565s wall (slimfit#56).
[idle]
tasks = "slimfit --version && docfit --version && slimfit next --all --sample 5 && docfit next --all"
every = 86400
limit = 3600
